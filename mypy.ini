[mypy]
python_version = 3.9
pretty = True
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = False
disallow_untyped_defs = False
no_implicit_optional = True

# v77 checks all eight runtime modules when mypy is run, including the manual live smoke and static HTML report modules. Core parser/matcher/batch contracts
# remain typed, and the live Algolia transport exposes typed request/event
# shapes so payload wiring is checked without changing runtime behavior.
