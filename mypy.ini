[mypy]
python_version = 3.9
pretty = True
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = False
disallow_untyped_defs = False
no_implicit_optional = True

# Run mypy on all runtime modules (untap*.py) using the documented command.
# Python 3.9 remains the runtime target; parenthesized with statements are
# supported on 3.9, which also runs the deterministic suite locally.
