[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untap"
dynamic = ["version"]
description = "Match beer menus against Untappd and create self-contained review reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["playwright==1.57.0"]

[project.urls]
Repository = "https://github.com/ttoikkan/untap"

[project.scripts]
untap = "untap.cli:main"
untap-review = "untap.local_review:main"
untap-refresh = "untap.refresh:main"
untap-publish = "untap.publish:main"
untap-inspect = "untap.inspect:main"
untap-install-browser = "untap.setup:main"

[tool.setuptools]
packages = ["untap", "untap.assets"]
py-modules = ["untap_cli", "untap_local_review", "untap_refresh", "untap_publish", "untap_inspect", "untap_setup"]

[tool.setuptools.dynamic]
version = {attr = "untap.version.__version__"}

[tool.setuptools.package-data]
"untap.assets" = ["untap_review.js"]
