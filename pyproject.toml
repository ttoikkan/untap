[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untap"
dynamic = ["version"]
description = "Match beer menus against Untappd and create self-contained review reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["playwright==1.57.0"]

[project.urls]
Repository = "https://github.com/ttoikkan/untap"

[project.scripts]
untap = "untap_cli:main"
untap-review = "untap_local_review:main"
untap-refresh = "untap_refresh:main"
untap-publish = "untap_publish:main"
untap-inspect = "untap_inspect:main"
untap-install-browser = "untap_setup:main"

[tool.setuptools]
packages = ["untap_assets"]
py-modules = ["untap", "untap_batch", "untap_cli", "untap_continue", "untap_identity", "untap_inspect", "untap_local_review", "untap_manual_candidates", "untap_matcher", "untap_parser", "untap_publish", "untap_refresh", "untap_refresh_config", "untap_registry", "untap_report", "untap_setup", "untap_smoke", "untap_snapshot", "untap_types", "untap_untappd", "untap_version"]

[tool.setuptools.dynamic]
version = {attr = "untap_version.__version__"}

[tool.setuptools.package-data]
untap_assets = ["untap_review.js"]
